<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Converta documentos DOCX para DOC diretamente no navegador."
    />
    <meta name="theme-color" content="#071e63" />
    <title>Conversor documentos Superlógica</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23082066'/%3E%3Cpath d='M15 32 32 17 49 32M22 29v19h20V29M29 48V35h7v13' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="home-link" href="../../index.html" aria-label="Voltar ao menu principal"><img src="../../assets/home-icon.png" alt="" width="512" height="512"></a>
    <img class="mapa-logo" src="../../assets/mapa-logo.png" alt="Mapa Imobiliária" width="447" height="112">
    <main class="page-shell">
      <section class="converter-card" aria-labelledby="page-title">
        <h1 id="page-title">Conversor documentos <span>Superlógica</span></h1>

        <div
          class="drop-zone"
          id="drop-zone"
          role="button"
          tabindex="0"
          aria-controls="file-input"
          aria-describedby="drop-hint"
        >
          <input
            id="file-input"
            type="file"
            accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            hidden
          />
          <div class="document-icon" aria-hidden="true">
            <span></span>
          </div>
          <p class="drop-title">Arraste seu arquivo DOCX aqui</p>
          <p class="drop-divider"><span>ou</span></p>
          <span class="choose-button">Escolher arquivo</span>
          <p class="drop-hint" id="drop-hint">Máximo de 30 MB</p>
        </div>

        <div class="file-card" id="file-card" hidden>
          <div class="file-badge" aria-hidden="true">DOCX</div>
          <div class="file-copy">
            <strong id="file-name"></strong>
            <span id="file-size"></span>
          </div>
          <button class="remove-button" id="remove-button" type="button">
            Remover
          </button>
        </div>

        <button class="convert-button" id="convert-button" type="button" disabled>
          <span class="button-label">Converter para DOC</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>

        <div class="status-card" id="status-card" role="status" aria-live="polite" hidden>
          <div class="status-icon" id="status-icon" aria-hidden="true">✓</div>
          <div class="status-copy">
            <strong id="status-title"></strong>
            <span id="status-message"></span>
          </div>
          <button class="download-again" id="download-again" type="button" hidden>
            Baixar novamente
          </button>
        </div>

        <div class="privacy-note">
          <span class="lock-icon" aria-hidden="true"></span>
          <p>
            <strong>Conversão local e segura.</strong>
            Seu arquivo não sai deste computador.
          </p>
        </div>
      </section>

    </main>

    <script src="vendor/mammoth.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
